[package]
name = "rfanalyzer"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
cpal = "0.18"
crossbeam-channel = "0.5.17"
eframe = { version = "0.37", features = ["persistence"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libloading = "0.9"
libusb1-sys = { version = "0.7", features = ["vendored"], optional = true }
parking_lot = "0.13.0"
rfd = "0.18.0"
rustfft = "6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
cc = "1.11.3"

[features]
default = ["dab", "static-sdr"]
dab = []
# RTL-SDR and HackRF libraries built in (else rtlsdr.dll / hackrf.dll are loaded at run time)
static-sdr = ["dep:libusb1-sys"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
opt-level = 2
